name: daily-scan

on:
  schedule:
    # Scan gegen 10:00 Berlin, damit die Stellen vom Morgen (HR veröffentlicht oft früh am Tag) schon drin sind;
    # die Morgenaufgabe läuft um 10:53. Hauptauslöser ist eine Claude-Aufgabe um 09:57 Berlin (workflow_dispatch mit
    # only_if_missing=true) — GitHub startet geplante Läufe nur nach Möglichkeit (05.11.2026: 8 h zu spät, 06.11.: gar
    # nicht). Die Zeitfenster hier sind Reserve (UTC; Winter 09:53 und 10:19 Berlin, Sommer eine Stunde später).
    # Es zählt der erste vollständige Lauf des Tages ab 09:30 Berlin, spätere enden nach ein paar Sekunden.
    - cron: '53 8 * * *'
    - cron: '19 9 * * *'
  workflow_dispatch:
    inputs:
      only_if_missing:
        description: 'Nur scannen, wenn es heute noch keinen vollständigen Lauf gab'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scan.py
      - config.json
      - requirements.txt
      - .github/workflows/daily.yml

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache vom data-Branch holen
        run: |
          # Ergebnisse und Caches liegen im Branch "data" (jeden Tag ein frischer Commit, keine wachsende Historie)
          git fetch --depth 1 origin data && git checkout origin/data -- data || echo "noch kein data-Branch"
          git reset -q
      - name: Heute schon gelaufen?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          ONLY_IF_MISSING: ${{ inputs.only_if_missing }}
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os
          from zoneinfo import ZoneInfo
          skip = False
          if os.environ["EVENT"] == "schedule" or os.environ.get("ONLY_IF_MISSING") == "true":
              try:
                  rl = json.load(open("data/run-log.json", encoding="utf-8"))
                  berlin = ZoneInfo("Europe/Berlin")
                  gen = dt.datetime.fromisoformat((rl.get("generated") or "").replace("Z", "+00:00")).astimezone(berlin)
                  now = dt.datetime.now(berlin)
                  # zählt nur ein vollständiger Scan von heute ab 09:30 Berlin (frühere Läufe, z. B. nach einem
                  # nächtlichen Push, enthalten die Stellen vom Morgen noch nicht)
                  done = (not rl.get("aborted") and gen.date() == now.date() and gen.strftime("%H:%M") >= "09:30"
                          and ((rl.get("stats") or {}).get("jobboerse_unique") or 0) > 0)
                  skip = bool(done)
                  print("letzter Lauf (Berlin):", gen.strftime("%Y-%m-%d %H:%M"), "→ überspringen" if skip else "→ scannen")
              except Exception as e:  # noqa: BLE001
                  print("run-log nicht auswertbar → scannen:", e)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          EOF
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - name: Abhängigkeiten
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          pip install python-jobspy || echo "jobspy nicht installiert – Scan läuft ohne"
      - name: Scan
        if: steps.guard.outputs.skip != 'true'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scan.py
      - name: Ergebnis in Branch data schreiben
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "jobscan-bot"
          git config user.email "jobscan-bot@users.noreply.github.com"
          git checkout -q --orphan data-new
          git reset -q
          git add -f data
          git commit -q -m "scan $(date -u +%FT%H:%MZ)" || echo "nichts zu committen"
          git push -f origin HEAD:data
