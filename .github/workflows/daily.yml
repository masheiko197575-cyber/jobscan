name: daily-scan

on:
  schedule:
    - cron: '35 6 * * *'   # 07:35 Berlin (CET) / 08:35 (CEST) — vor dem Morgen-Scan um 09:52
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scan.py
      - config.json
      - requirements.txt
      - .github/workflows/daily.yml

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten
        run: |
          pip install -r requirements.txt
          pip install python-jobspy || echo "jobspy nicht installiert – Scan läuft ohne"
      - name: Cache vom data-Branch holen
        run: |
          # Ergebnisse und Caches liegen im Branch "data" (jeden Tag ein frischer Commit, keine wachsende Historie)
          git fetch --depth 1 origin data && git checkout origin/data -- data || echo "noch kein data-Branch"
          git reset -q
      - name: Scan
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scan.py
      - name: Ergebnis in Branch data schreiben
        if: always()
        run: |
          git config user.name "jobscan-bot"
          git config user.email "jobscan-bot@users.noreply.github.com"
          git checkout -q --orphan data-new
          git reset -q
          git add -f data
          git commit -q -m "scan $(date -u +%FT%H:%MZ)" || echo "nichts zu committen"
          git push -f origin HEAD:data
