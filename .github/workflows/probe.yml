name: probe

on:
  push:
    branches: [probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python probe.py
      - name: Ergebnis in Branch probe-out
        if: always()
        run: |
          git config user.name "jobscan-bot"
          git config user.email "jobscan-bot@users.noreply.github.com"
          git checkout -q --orphan probe-new
          git reset -q
          git add -f data/probe
          git commit -q -m "probe $(date -u +%FT%H:%MZ)" || echo "nichts"
          git push -f origin HEAD:probe-out
